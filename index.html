function render(){
  const term=q.value.toLowerCase().trim(), fil=f.value;
  list.innerHTML="";
  let n=0;
  for(const e of episodes){
    const title=titleOf(e);
    const hay=(e.series+" saison "+e.season+" épisode "+e.episode+" "+title+" "+(e.tag||"")).toLowerCase();
    if(fil!=="Tous" && e.series!==fil) continue;
    if(term && !hay.includes(term)) continue;
    n++;
    const c=document.createElement("div");
    c.className="card"+(e.tag?" cross":"")+(state[e.id]?" done":"");
    c.id="ep-"+e.id;

    const cb=document.createElement("input");
    cb.type="checkbox"; cb.className="check"; cb.checked=!!state[e.id];
    cb.onchange=()=>{ if(cb.checked) state[e.id]=1; else delete state[e.id]; c.classList.toggle("done",cb.checked); save(); };

    const num=document.createElement("div"); num.className="num"; num.textContent=e.id;
    const info=document.createElement("div"); info.className="info";
    info.innerHTML =
      '<div class="series">'+esc(e.series)+(e.tag?' <span class="badge">CROSSOVER</span>':'')+'</div>'+
      '<div class="title">'+esc(title)+'</div>'+
      '<div class="ep">Saison '+e.season+' · épisode '+String(e.episode).padStart(2,"0")+
      (e.tag?' — '+esc(e.tag):'')+'</div>';
    c.append(cb,num,info); list.append(c);
  }
  if(!n) list.innerHTML='<div class="loading">Aucun épisode trouvé.</div>';
}

async function loadTitles(){
  try {
    const jobs=Object.entries(SHOW_IDS).map(async ([series,id])=>{
      const r=await fetch("https://api.tvmaze.com/shows/"+id+"/episodes");
      if(!r.ok) throw new Error(series+" HTTP "+r.status);
      const arr=await r.json();
      for(const ep of arr){
        if(ep.season && ep.number && ep.name) titles[series+"|"+ep.season+"|"+ep.number]=ep.name;
      }
    });
    await Promise.all(jobs);
    localStorage.setItem(TITLE_KEY,JSON.stringify(titles));
  } catch(err) {
    console.warn("Impossible de charger tous les titres TVmaze:",err);
  }
  render();
}

q.oninput=render; f.onchange=render;

document.getElementById("next").onclick=()=>{
  const term=q.value.toLowerCase().trim(), fil=f.value;
  const e=episodes.find(x=>{
    const hay=(x.series+" saison "+x.season+" épisode "+x.episode+" "+titleOf(x)+" "+(x.tag||"")).toLowerCase();
    return !state[x.id] && (fil==="Tous"||x.series===fil) && (!term||hay.includes(term));
  });
  if(!e) return alert("🎉 Aucun épisode non vu ne correspond au filtre.");
  document.getElementById("ep-"+e.id)?.scrollIntoView({behavior:"smooth",block:"center"});
};

document.getElementById("reset").onclick=()=>{
  if(confirm("Réinitialiser toute la progression ?")){state={};save();render();scrollTo({top:0,behavior:"smooth"});}
};

updateProgress();
render();
loadTitles();
</script>
</body>
</html>
