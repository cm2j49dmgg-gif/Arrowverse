function startRealtimeSync(){
  if(!syncRoom||!syncRef)return;
  syncRef.off();

    const remote=snap.val();
    if(!remote||!Array.isArray(remote.ids))return;
    const meta=JSON.parse(localStorage.getItem(SYNC_META_KEY)||"{}"), localTs=Number(meta.updatedAt||0), remoteTs=Number(remote.updatedAt||0);

}
async function connectSync(){
  try{
    await auth.signInAnonymously();

}
function pushSync(){
  if(!syncRoom||!syncRef||syncWriting)return;
  const now=Date.now();
  localStorage.setItem(SYNC_META_KEY,JSON.stringify({updatedAt:now}));
  syncWriting=true;
  syncRef.set({v:1,ids:EPISODES.filter(e=>state[e.id]).map(e=>e.id),updatedAt:now}).finally(()=>{syncWriting=false;});
}
function createSyncRoom(){
  if(!syncRoom)syncRoom=randomRoom();

  document.getElementById("syncCode").value=syncLink();

  if(auth.currentUser){syncRef=db.ref("arrowverse_sync/"+syncRoom);startRealtimeSync();pushSync();}
}
async function copySyncLink(){
  if(!syncRoom)createSyncRoom();

}
function importRoomFromUrl(){
  const m=location.hash.match(/^#room=(.+)$/);
  if(!m)return;

  catch(e){}
}

const PROGRESS_KEY="arrowverse_progress_final_v1";
let state=JSON.parse(localStorage.getItem(PROGRESS_KEY)||"{}");
let editing=false;
const ICONS={
 "Arrow":"🏹",
 "The Flash":"⚡",
 "Supergirl":"☀️",
 "Legends of Tomorrow":"⏳",
 "Batwoman":"🦇",
 "Superman & Lois":"🛡️"
};
function seriesLabel(name){ return `${ICONS[name]||"📺"} ${name}`; }

function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));}
function render(){
 const q=document.getElementById("search").value.toLowerCase().trim();
 const f=document.getElementById("series").value;
 const list=document.getElementById("list"); list.innerHTML=""; list.className=editing?"editing":"";
 for(const e of EPISODES){
  if(f&&e.series!==f)continue;
  if(q&&!(e.series+" "+e.title+" s"+e.season+"e"+e.episode).toLowerCase().includes(q))continue;
  const row=document.createElement("div"); row.className="row"+(state[e.id]?" done":"");
  row.innerHTML=`<input type="checkbox" ${state[e.id]?"checked":""}>
   <div class="num">${e.id}</div><div class="info">
   <div class="series">${esc(seriesLabel(e.series))} ${e.tag?'<span class="badge">CROSSOVER</span>':""}</div>
   <div class="title">${esc(e.title)}</div>
   <div class="editBox"><input class="titleInput" value="${esc(e.title)}"></div>
   <div class="ep">Saison ${e.season} · épisode ${String(e.episode).padStart(2,"0")}</div>
   </div>`;
  row.querySelector('input[type="checkbox"]').onchange=ev=>{if(ev.target.checked)state[e.id]=1;else delete state[e.id];localStorage.setItem(PROGRESS_KEY,JSON.stringify(state));render();pushSync();};
  const ti=row.querySelector(".titleInput"); ti.oninput=()=>{e.title=ti.value;};
  list.appendChild(row);
 }
 const done=EPISODES.filter(e=>state[e.id]).length,total=EPISODES.length;
 document.getElementById("stats").textContent=`${done} / ${total} épisodes vus — ${Math.round(done/total*100)} %`;
 document.getElementById("bar").style.width=(done/total*100)+"%";
}
function toggleEdit(){editing=!editing;render();}
function saveTitles(){localStorage.setItem("arrowverse_titles_final_v1",JSON.stringify(EPISODES.map(e=>({id:e.id,title:e.title}))));editing=false;render();document.getElementById("status").textContent="Titres enregistrés sur cet appareil.";}
function resetProgress(){if(confirm("Réinitialiser toute la progression ?")){state={};localStorage.removeItem(PROGRESS_KEY);render();}}

function toggleSync(){document.getElementById("syncPanel").classList.toggle("open");}
[...new Set(EPISODES.map(e=>e.series))].forEach(s=>document.getElementById("series").insertAdjacentHTML("beforeend",`<option value="${esc(s)}">${esc(seriesLabel(s))}</option>`));
importRoomFromUrl();
document.getElementById("search").oninput=render; document.getElementById("series").onchange=render; render();
if(syncRoom)document.getElementById("syncCode").value=syncLink();
connectSync();
</script>
