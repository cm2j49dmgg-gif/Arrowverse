<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arrowverse">
<title>Mon Arrowverse</title>
<style>
:root{color-scheme:dark;--bg:#0b0d12;--card:#151922;--line:#2a3040;--text:#f5f7fb;--muted:#9aa4b2;--accent:#f59e0b;--done:#687386}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}
main{max-width:760px;margin:auto;padding:18px 14px 40px}
h1{font-size:28px;margin:4px 0}.sub{color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:14px}
.progress{height:10px;background:#252b38;border-radius:20px;overflow:hidden;margin:10px 0}.bar{height:100%;width:0;background:var(--accent)}
.actions{display:flex;gap:8px;flex-wrap:wrap}.btn,.select,.search{min-height:44px;border:1px solid var(--line);border-radius:12px;background:#10141c;color:var(--text);padding:9px 12px;font-size:15px}.btn.primary{background:var(--accent);color:#111;border-color:var(--accent);font-weight:700}
.search{width:100%}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.episode{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line);min-height:52px}.episode:last-child{border-bottom:0}
.episode input{width:21px;height:21px;accent-color:var(--accent);flex:none}.episode.done .name{text-decoration:line-through;color:var(--done)}
.cross{color:#ffd27a}.tag{font-size:11px;padding:3px 7px;border:1px solid var(--line);border-radius:999px;color:var(--muted);margin-left:auto;white-space:nowrap}
.next{font-size:15px}.next strong{color:#ffd27a}.small{font-size:12px;color:var(--muted)}
@media(max-width:480px){.filters{grid-template-columns:1fr}.btn{flex:1}}
</style>
</head>
<body>
<main>
<header>
<h1>🏹 Mon Arrowverse</h1>
<div class="sub">Arrow • The Flash • Supergirl • Legends • Batwoman • Superman & Lois</div>
<div class="sub">Black Lightning et Constantine exclus • 6 séries</div>
</header>

<section class="card">
<div style="display:flex;justify-content:space-between;gap:10px"><strong id="stats">0 / 0 épisodes</strong><strong id="percent">0%</strong></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="next" id="next">Prochain épisode : <strong>...</strong></div>
<div class="actions" style="margin-top:12px">
<button class="btn primary" id="nextBtn">▶️ Épisode suivant</button>
<button class="btn" id="resetBtn">Réinitialiser</button>
</div>
</section>

<section class="card">
<div class="filters">
<input class="search" id="search" placeholder="🔎 Rechercher un épisode…">
<select class="select" id="series"><option value="">Toutes les séries</option></select>
</div>
</section>

<section class="card" id="list"></section>
<div class="small" style="margin-top:12px">Ta progression est enregistrée dans le navigateur de cet appareil.</div>
</main>

const KEY = "arrowverse-progress-v2";
let memoryProgress = [];
function loadProgress(){
  try {
    const raw = localStorage.getItem(KEY);
    return new Set(raw ? JSON.parse(raw) : []);
  } catch(e) {
    return new Set(memoryProgress);
  }
}
let done = loadProgress();
const $ = id => document.getElementById(id);

function save(){
  memoryProgress = [...done];
  try { localStorage.setItem(KEY, JSON.stringify(memoryProgress)); } catch(e) {}
}
function renderSeries(){
  const vals=[...new Set(EPISODES.map(e=>e.series))].sort((a,b)=>a.localeCompare(b));
  vals.forEach(v=>{const o=document.createElement("option");o.value=v;o.textContent=v;$("series").appendChild(o);});
}
function render(){
  const q=$("search").value.trim().toLowerCase(), s=$("series").value;
  const list=$("list"); list.innerHTML="";
  let visible=0;
  EPISODES.forEach((e,i)=>{
    if(s && e.series!==s) return;
    if(q && !e.title.toLowerCase().includes(q)) return;
    visible++;
    const row=document.createElement("label"); row.className="episode"+(done.has(i)?" done":"");
    const cb=document.createElement("input"); cb.type="checkbox"; cb.checked=done.has(i);
    cb.addEventListener("change",()=>{cb.checked?done.add(i):done.delete(i);save();render();});
    const name=document.createElement("span"); name.className="name"+(e.crossover?" cross":""); name.textContent=(e.crossover?"🔀 ":"")+e.title;
    const tag=document.createElement("span"); tag.className="tag"; tag.textContent=e.crossover?"Crossover":e.series;
    row.append(cb,name,tag); list.appendChild(row);
  });
  if(!visible){list.innerHTML='<div class="small">Aucun épisode trouvé.</div>';}
  updateHeader();
}
function updateHeader(){
  const n=done.size,p=EPISODES.length?Math.round(n/EPISODES.length*100):0;
  $("stats").textContent=`${n} / ${EPISODES.length} épisodes`;
  $("percent").textContent=`${p}%`; $("bar").style.width=p+"%";
  const i=EPISODES.findIndex((_,idx)=>!done.has(idx));
  $("next").innerHTML=i<0?"🎉 <strong>Arrowverse terminé !</strong>":`Prochain épisode : <strong>${EPISODES[i].title}</strong>`;
}
$("search").addEventListener("input",render);$("series").addEventListener("change",render);
$("nextBtn").addEventListener("click",()=>{
  const i=EPISODES.findIndex((_,idx)=>!done.has(idx)); if(i<0)return;
  const row=[...$("list").querySelectorAll(".episode")].find(el=>el.textContent.includes(EPISODES[i].title));
  if(row){row.scrollIntoView({behavior:"smooth",block:"center"});row.style.outline="2px solid var(--accent)";setTimeout(()=>row.style.outline="",1200);}
  else {$("search").value="";$("series").value="";render();setTimeout(()=>{const r=[...$("list").querySelectorAll(".episode")].find(el=>el.textContent.includes(EPISODES[i].title));if(r)r.scrollIntoView({behavior:"smooth",block:"center"});},50);}
});
$("resetBtn").addEventListener("click",()=>{if(confirm("Effacer toute ta progression ?")){done.clear();save();render();}});
renderSeries();render();
</script>
